# ZoomPaper 发布工作流
#
# 触发方式（二选一）：
#   1. 推送 v* 标签（推荐）：git tag v0.2.0 && git push origin v0.2.0
#   2. 手动触发：Actions 页面 → Release → Run workflow → 填写版本号（如 0.2.0）
#
# 产物：macOS Apple Silicon 安装包 ZoomPaper_<ver>_aarch64.dmg
#       （上传为草稿 Release，审核后手动发布）
#
# macOS 签名/公证（决定用户下载后能否直接打开）：
#   - 未配置任何 Apple secrets 时，回退为 ad-hoc 签名（APPLE_SIGNING_IDENTITY=-）。
#     ad-hoc 签名能避免 macOS 报「App 已损坏，无法打开」（那是签名缺失/损坏时的提示），
#     但用户首次打开仍需在「系统设置 → 隐私与安全性 → 仍要打开」放行一次。
#   - 配齐以下 secrets 后自动升级为 Developer ID 签名 + 公证，用户可直接双击打开：
#       APPLE_CERTIFICATE            Developer ID Application 证书（.p12 的 base64）
#       APPLE_CERTIFICATE_PASSWORD   导出 .p12 时设置的密码
#       APPLE_SIGNING_IDENTITY       如 "Developer ID Application: Your Name (TEAMID)"
#       APPLE_ID / APPLE_PASSWORD / APPLE_TEAM_ID
#                                    公证账号（APPLE_PASSWORD 为 App 专用密码）
#     也可改用 App Store Connect API Key：APPLE_API_ISSUER / APPLE_API_KEY / APPLE_API_KEY_PATH。
#   - 构建后会执行签名校验，签名无效（用户会看到「已损坏」）时该 job 直接失败。
#
# 说明：只构建 aarch64-apple-darwin（Apple Silicon）。fastembed 依赖的 ort-sys
#       没有 x86_64-apple-darwin 预编译二进制（ONNX Runtime 已不再提供 macOS
#       Intel 产物），universal 构建会在 x86_64 阶段报
#       "no prebuilt binaries available for target x86_64-apple-darwin" 而失败；
#       macos-13（Intel）runner 也已被 GitHub 弃用。v0.1.0/v0.1.1 的 dmg 同样是 arm64。

name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "发布版本号（如 0.2.0；tag 触发时自动取标签版本）"
        required: false
      draft:
        description: "输出为草稿 Release；要直接替换已发布版本的安装包请填 false"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest # Apple Silicon（arm64）
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Resolve version
        id: version
        run: |
          VERSION="${{ inputs.version }}"
          if [ -z "${VERSION}" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          if [ -z "${VERSION}" ]; then
            echo "::error::无法解析版本号：请推送 v* 标签，或在手动触发时填写 version"
            exit 1
          fi
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "tag=v${VERSION}" >> "${GITHUB_OUTPUT}"

      - name: Sync app version
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          echo "Syncing version to ${VERSION}"
          npm pkg set version="${VERSION}"
          sed -i '' "s/\"version\": \"[^\"]*\"/\"version\": \"${VERSION}\"/" src-tauri/tauri.conf.json
          grep -n '"version"' src-tauri/tauri.conf.json

      - name: Configure macOS signing
        env:
          IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          NOTARY_ID: ${{ secrets.APPLE_ID }}
          NOTARY_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # 注意：未配置的 secret 会被 GitHub 注入成"空字符串"环境变量，而 Tauri 只要
          # 检测到 APPLE_CERTIFICATE 存在（哪怕是空值）就会去导入证书并失败：
          # security: SecKeychainItemImport: One or more parameters ... were not valid.
          # 所以这里只在值非空时才写入环境变量。
          export_env() {
            if [ -n "$2" ]; then
              echo "$1=$2" >> "${GITHUB_ENV}"
            fi
          }

          # APPLE_SIGNING_IDENTITY 环境变量优先于 tauri.conf.json 的 signingIdentity
          # （见 tauri-cli interface/rust.rs），因此这里按 secrets 情况决定签名模式。
          if [ -n "${IDENTITY}" ]; then
            echo "APPLE_SIGNING_IDENTITY=${IDENTITY}" >> "${GITHUB_ENV}"
            export_env APPLE_CERTIFICATE "${CERTIFICATE}"
            export_env APPLE_CERTIFICATE_PASSWORD "${CERTIFICATE_PASSWORD}"
            echo "==> 签名模式：Developer ID（${IDENTITY}）"
          elif [ -n "${CERTIFICATE}" ]; then
            echo "::error::已配置 APPLE_CERTIFICATE，但缺少 APPLE_SIGNING_IDENTITY。请补上证书身份（如 \"Developer ID Application: Your Name (TEAMID)\"）。"
            exit 1
          else
            echo "APPLE_SIGNING_IDENTITY=-" >> "${GITHUB_ENV}"
            echo "==> 签名模式：ad-hoc（未配置 Developer ID 证书，用户首次打开需手动放行一次）"
          fi

          # 公证凭据：缺任意一项时 Tauri 会自动跳过公证（只签名）
          export_env APPLE_ID "${NOTARY_ID}"
          export_env APPLE_PASSWORD "${NOTARY_PASSWORD}"
          export_env APPLE_TEAM_ID "${TEAM_ID}"
          if [ -n "${NOTARY_ID}" ] && [ -n "${NOTARY_PASSWORD}" ] && [ -n "${TEAM_ID}" ]; then
            echo "==> 已启用公证（notarization）"
          else
            echo "==> 未启用公证（缺少 APPLE_ID / APPLE_PASSWORD / APPLE_TEAM_ID）"
          fi

      - name: Build & publish .dmg (Apple Silicon)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 签名/公证相关的 APPLE_* 变量由上面的 Configure macOS signing 步骤按需注入
          # （不能在这里直接写 ${{ secrets.X }}：未配置的 secret 会变成空字符串，
          #   Tauri 会把它当成"已提供证书"而导入失败）
        with:
          tagName: ${{ steps.version.outputs.tag }}
          releaseName: "ZoomPaper v${{ steps.version.outputs.version }}"
          # 手动触发时可选择直接更新已发布版本（draft=false，同名安装包会被替换）；
          # 推送 tag 时仍固定为草稿，沿用「人工审核后再发布」的流程。
          releaseDraft: ${{ github.event_name != 'workflow_dispatch' || inputs.draft }}
          # 如需推送 tag 后自动发布（无需手动确认），把上面的固定值改为 false
          prerelease: false
          args: --bundles dmg --target aarch64-apple-darwin

      - name: Verify macOS signature & dmg
        run: |
          set -euo pipefail

          APP="src-tauri/target/aarch64-apple-darwin/release/bundle/macos/ZoomPaper.app"
          if [ ! -d "${APP}" ]; then
            APP="$(find src-tauri/target -maxdepth 6 -type d -name 'ZoomPaper.app' -path '*release/bundle/macos/*' | head -n 1)"
          fi
          if [ -z "${APP}" ] || [ ! -d "${APP}" ]; then
            echo "::error::未找到构建出的 ZoomPaper.app，无法校验签名"
            exit 1
          fi
          echo "==> 校验对象：${APP}"

          echo "==> 签名信息"
          codesign -dv --verbose=4 "${APP}" 2>&1 | grep -E "Identifier|Format|flags|Authority|TeamIdentifier|Signature|Sealed Resources" || true

          # 签名损坏/缺失时，用户下载后 macOS 会提示「已损坏，无法打开。您应该将它移到废纸篓」
          if ! codesign --verify --deep --strict --verbose=2 "${APP}" 2>&1; then
            echo "::error::应用签名无效（用户会看到「已损坏，无法打开」）。请检查 tauri.conf.json 的 bundle.macOS.signingIdentity 与 APPLE_CERTIFICATE / APPLE_SIGNING_IDENTITY 配置。"
            exit 1
          fi
          echo "==> codesign 校验通过"

          DMG="$(find src-tauri/target/aarch64-apple-darwin/release/bundle/dmg -maxdepth 1 -type f -name '*.dmg' 2>/dev/null | head -n 1)"
          if [ -z "${DMG}" ]; then
            DMG="$(find src-tauri/target -maxdepth 6 -type f -name '*.dmg' -path '*release/bundle/dmg/*' | head -n 1)"
          fi
          if [ -z "${DMG}" ]; then
            echo "::error::未找到构建出的 .dmg"
            exit 1
          fi
          hdiutil verify "${DMG}"
          echo "==> dmg 校验和正常：$(basename "${DMG}") （$(shasum -a 256 "${DMG}" | awk '{print $1}')）"

          # 用户拿到的是 dmg 里的 app，这里直接挂载 dmg 校验其中真正的产物
          MOUNT="$(mktemp -d)"
          trap 'hdiutil detach "${MOUNT}" >/dev/null 2>&1 || true' EXIT
          hdiutil attach "${DMG}" -nobrowse -readonly -mountpoint "${MOUNT}" >/dev/null
          INNER="${MOUNT}/ZoomPaper.app"
          if [ ! -d "${INNER}" ]; then
            echo "::error::dmg 中未找到 ZoomPaper.app"
            exit 1
          fi
          codesign -dv --verbose=4 "${INNER}" 2>&1 | grep -E "Identifier|flags|Authority|TeamIdentifier|Signature|Sealed Resources" || true
          if ! codesign --verify --deep --strict --verbose=2 "${INNER}" 2>&1; then
            echo "::error::dmg 内的 app 签名无效（用户会看到「已损坏，无法打开」）"
            exit 1
          fi
          echo "==> dmg 内 app 签名校验通过"

          echo "==> 公证状态"
          if xcrun stapler validate "${APP}" >/dev/null 2>&1; then
            echo "已公证并装订公证票据：用户可直接双击打开。"
          else
            echo "::warning::未公证（ad-hoc 或未配置公证凭据）：用户首次打开需到「系统设置 → 隐私与安全性 → 仍要打开」，或执行 xattr -dr com.apple.quarantine /Applications/ZoomPaper.app。"
          fi
