# ZoomPaper 发布工作流
#
# 触发方式（二选一）：
#   1. 推送 v* 标签（推荐）：git tag v0.2.0 && git push origin v0.2.0
#   2. 手动触发：Actions 页面 → Release → Run workflow → 填写版本号（如 0.2.0）
#
# 产物：macOS Apple Silicon 安装包 ZoomPaper_<ver>_aarch64.dmg
#       （上传为草稿 Release，审核后手动发布）
#
# 说明：只构建 aarch64-apple-darwin（Apple Silicon）。fastembed 依赖的 ort-sys
#       没有 x86_64-apple-darwin 预编译二进制（ONNX Runtime 已不再提供 macOS
#       Intel 产物），universal 构建会在 x86_64 阶段报
#       "no prebuilt binaries available for target x86_64-apple-darwin" 而失败；
#       macos-13（Intel）runner 也已被 GitHub 弃用。v0.1.0/v0.1.1 的 dmg 同样是 arm64。

name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "发布版本号（如 0.2.0；tag 触发时自动取标签版本）"
        required: false

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest # Apple Silicon（arm64）
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Resolve version
        id: version
        run: |
          VERSION="${{ inputs.version }}"
          if [ -z "${VERSION}" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          if [ -z "${VERSION}" ]; then
            echo "::error::无法解析版本号：请推送 v* 标签，或在手动触发时填写 version"
            exit 1
          fi
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "tag=v${VERSION}" >> "${GITHUB_OUTPUT}"

      - name: Sync app version
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          echo "Syncing version to ${VERSION}"
          npm pkg set version="${VERSION}"
          sed -i '' "s/\"version\": \"[^\"]*\"/\"version\": \"${VERSION}\"/" src-tauri/tauri.conf.json
          grep -n '"version"' src-tauri/tauri.conf.json

      - name: Build & publish .dmg (Apple Silicon)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ steps.version.outputs.tag }}
          releaseName: "ZoomPaper v${{ steps.version.outputs.version }}"
          releaseDraft: true
          # 如需推送 tag 后自动发布（无需手动确认），把 releaseDraft 改为 false
          prerelease: false
          args: --bundles dmg --target aarch64-apple-darwin
